name: wa-akg

services:
  db:
    image: mysql:8.0
    container_name: wa-akg-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wa_akg}
      MYSQL_USER: ${MYSQL_APP_USER:-wa_akg_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - wa-akg-network

  app:
    image: ${WA_AKG_IMAGE:-wa-akg:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wa-akg-app
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-43000}:${PORT:-43000}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-43000}
      HOSTNAME: 0.0.0.0
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wa_akg}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-wa_akg_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no arquivo .env}
      AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET no arquivo .env}
      BASE_URL: ${BASE_URL:-http://localhost:43000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:43000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:43000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:43000/api}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      BAILEYS_LOG_LEVEL: ${BAILEYS_LOG_LEVEL:-error}
      NEXT_PUBLIC_SWAGGER_ENABLED: ${NEXT_PUBLIC_SWAGGER_ENABLED:-true}
      SWAGGER_USERNAME: ${SWAGGER_USERNAME:-admin}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD:-}
      TZ: ${TZ:-America/Sao_Paulo}
      LOCALE: ${LOCALE:-pt-BR}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      REMOVE_BG_API_KEY: ${REMOVE_BG_API_KEY:-}
      WA_AKG_MCP_ENABLED: ${WA_AKG_MCP_ENABLED:-false}
      WA_AKG_MCP_HTTP_PATH: ${WA_AKG_MCP_HTTP_PATH:-/mcp}
      WA_AKG_MCP_HTTP_TOKEN: ${WA_AKG_MCP_HTTP_TOKEN:-}
      WA_AKG_API_BASE_URL: ${WA_AKG_API_BASE_URL:-http://127.0.0.1:43000/api}
      WA_AKG_API_KEY: ${WA_AKG_API_KEY:-}
      WA_AKG_MCP_WRITE_ALLOWLIST: ${WA_AKG_MCP_WRITE_ALLOWLIST:-}
      WA_AKG_MCP_ALLOW_REMOTE_API: ${WA_AKG_MCP_ALLOW_REMOTE_API:-false}
      WA_AKG_TIMEOUT_MS: ${WA_AKG_TIMEOUT_MS:-15000}
      WA_AKG_MAX_RESPONSE_BYTES: ${WA_AKG_MAX_RESPONSE_BYTES:-1000000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data
      - uploads_data:/app/uploads
    networks:
      - wa-akg-network

  migrate:
    image: ${WA_AKG_IMAGE:-wa-akg:local}
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["ops"]
    command: ["node", "scripts/container-start.js", "migrate"]
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wa_akg}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-wa_akg_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no arquivo .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wa-akg-network

  admin-setup:
    image: ${WA_AKG_IMAGE:-wa-akg:local}
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["ops"]
    command: ["node", "scripts/container-start.js", "make-admin"]
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wa_akg}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-wa_akg_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL no arquivo .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wa-akg-network

  baseline:
    image: ${WA_AKG_IMAGE:-wa-akg:local}
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["ops"]
    command: ["node", "scripts/container-start.js", "baseline"]
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wa_akg}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-wa_akg_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no arquivo .env}
      PRISMA_BASELINE_MIGRATION: ${PRISMA_BASELINE_MIGRATION:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wa-akg-network

volumes:
  mysql_data:
    name: wa-akg-mysql-data
  app_data:
    name: wa-akg-app-data
  uploads_data:
    name: wa-akg-uploads-data

networks:
  wa-akg-network:
    name: wa-akg-network
    driver: bridge
